<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Research tracker boards</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ef;color:#163b34;font:16px/1.5 system-ui}main{max-width:1250px;margin:auto;padding:32px}h1{font:38px Georgia;margin:0}nav{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}button,select{font:inherit;border:1px solid #829b8e;background:white;color:#163b34;padding:6px 12px;border-radius:5px}button[aria-pressed=true]{background:#174a3c;color:white}#cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}section{background:#e5eae3;padding:12px;border-radius:8px}article{background:white;padding:13px;margin:12px 0;border-radius:6px}article p{font-size:14px}article b,small{display:block}small{color:#5e6d64}h2{font-size:18px}label{font-size:13px}select{display:block;font-size:13px} @media(max-width:800px){#cards{grid-template-columns:repeat(2,minmax(0,1fr))}} @media(max-width:500px){#cards{grid-template-columns:1fr}main{padding:15px}} </style>
<main><h1>Research tracker boards</h1><p>Madhav Vinod · PES1UG24CS254 · Problem 09</p><nav aria-label="Board views"></nav><p id="description"></p><div id="cards"></div></main>
<script>const stories=[{"key": "ST-01", "ref": "FR-001", "name": "Log a procurement claim", "detail": "Given 100,000 paise, accept a 62,000-paise invoice once and show 38,000 remaining.", "tag": "Sprint 1 / 3 pts", "status": "Selected"}, {"key": "ST-02", "ref": "FR-002", "name": "Request a Dean override", "detail": "Route the excess to the Dean. The original balance remains available until an authorized reallocation succeeds.", "tag": "Sprint 1 / 5 pts", "status": "Selected"}, {"key": "ST-03", "ref": "FR-003", "name": "Register a publication DOI", "detail": "Reject duplicate DOIs and associate the new publication with the selected grant.", "tag": "Sprint 2 / 3 pts", "status": "Backlog"}, {"key": "ST-04", "ref": "FR-005", "name": "Collect co-author consent", "detail": "With two listed authors, the first approval leaves the manuscript pending. The second clears it.", "tag": "Sprint 2 / 3 pts", "status": "Backlog"}, {"key": "ST-05", "ref": "FR-006", "name": "Forecast grant exhaustion", "detail": "Show a projected runout date from posted expenses. Show insufficient data on an empty history.", "tag": "Sprint 2 / 3 pts", "status": "Backlog"}, {"key": "ST-06", "ref": "NFR-001", "name": "Verify the audit trail", "detail": "Changing one recorded expense makes chain verification identify the affected entry.", "tag": "Sprint 1 / 5 pts", "status": "Selected"}, {"key": "ST-07", "ref": "NFR-002", "name": "Measure dashboard latency", "detail": "At 150 TPS and 2,000 concurrent sessions, measure p95 below 250 ms and p99 below 450 ms.", "tag": "Sprint 2 / 5 pts", "status": "Backlog"}], bugs=[{"key": "EXP-01", "ref": "Lab 5", "name": "Negative expense raises balance", "detail": "Submit -10 against 100. Baseline ends at 110. Expected rejection leaves 100.", "tag": "High", "status": "Done"}, {"key": "EXP-02", "ref": "Lab 5", "name": "Duplicate invoice paid twice", "detail": "Submit two identical A invoices of 20 against 100. Baseline leaves 60. Expected balance is 80.", "tag": "High", "status": "Done"}, {"key": "EXP-03", "ref": "Lab 5", "name": "Exact-balance claim skipped", "detail": "Submit 100 against 100. Baseline pays nothing. Expected remaining balance is zero.", "tag": "Medium", "status": "Done"}, {"key": "EXP-04", "ref": "Lab 5", "name": "Non-integer input aborts review", "detail": "Submit a string amount. The baseline assertion aborts the batch. Expected a row-level rejection.", "tag": "Medium", "status": "Done"}, {"key": "EXP-05", "ref": "Lab 5", "name": "Missing invoice aborts review", "detail": "Submit a claim of 1 without an invoice key. Baseline raises KeyError. Expected rejection with row number.", "tag": "Medium", "status": "Done"}];
const statuses=['Backlog','Selected','In progress','Done'];
const views={'Kanban':'Seven acceptance stories across two planned sprints.','Sprint 1':'Procurement and audit integrity. Three planned stories, 13 points.','Bug tracker':'Five defects reproduced on the Lab 5 baseline. The corrected module passes their regression cases.'};
let view='Kanban';let saved={};try{saved=JSON.parse(localStorage.getItem('pes09-research-boards-v1')||'{}')||{}}catch{}
function element(tag,txt,parent){const el=document.createElement(tag);el.textContent=txt;parent.append(el);return el}
function draw(){const nav=document.querySelector('nav');nav.replaceChildren();for(const title of Object.keys(views)){const b=element('button',title,nav);b.setAttribute('aria-pressed',view===title);b.onclick=()=>{view=title;draw()}}
document.querySelector('#description').textContent=views[view];let rows=view==='Bug tracker'?bugs:stories;if(view==='Sprint 1')rows=rows.filter(r=>r.tag.startsWith('Sprint 1'));
const root=document.querySelector('#cards');root.replaceChildren();for(const state of statuses){const col=element('section','',root);const group=rows.filter(r=>(saved[r.key]||r.status)===state);element('h2',state+' ('+group.length+')',col);for(const r of group){const card=element('article','',col);element('small',r.key+' · '+r.ref,card);element('b',r.name,card);element('p',r.detail,card);element('small',r.tag,card);const label=element('label','Move to',card);const sel=element('select','',label);sel.setAttribute('aria-label','Status of '+r.key);for(const s of statuses){const opt=element('option',s,sel);opt.selected=s===state}sel.onchange=()=>{saved[r.key]=sel.value;try{localStorage.setItem('pes09-research-boards-v1',JSON.stringify(saved))}catch{}draw()}}}}draw();</script></html>
